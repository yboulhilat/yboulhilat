name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }] # tous les jours à 3h
  workflow_dispatch:
  push: { branches: ["main"] }

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Carte générale : contributions, dépôts, commits (privés inclus grâce au token)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: yboulhilat
          template: classic
          base: header, repositories
          config_timezone: Africa/Casablanca
          config_display: large
          repositories_affiliations: owner
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: no

      # Langages les plus utilisés, calculés sur tous tes dépôts (privés compris)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: yboulhilat
          template: classic
          base: ""
          config_timezone: Africa/Casablanca
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, shell, dockerfile
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_sections: most-used

      # Calendrier isométrique de l'année
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.calendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: yboulhilat
          template: classic
          base: ""
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
